name: Portfolio hardening CI

on:
  push:
    branches: [main, portfolio-hardening, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, portfolio-hardening, "feat/**", "fix/**", "chore/**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run backend tests
        run: pnpm test
      - name: Run financial reliability suite
        run: pnpm run test:financial
      - name: Verify GraphQL composition
        env:
          STRIPE_SECRET_KEY: sk_test_ci_placeholder_key
          JWT_SECRET: drive-pilot-ci-test-only-secret-32-characters
        run: node -e "require('./src/config/CombineTypeDefs'); require('./src/config/CombineResolvers'); console.log('graphql composition ok')"
      - name: Check server syntax
        # GetRequiredSlotsLesson.js is an unreferenced ESM orphan in this
        # CommonJS package; keep it out of the runnable-server syntax gate.
        run: find src -type f -name '*.js' ! -name 'GetRequiredSlotsLesson.js' -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend utility tests
        run: node --test src/utils/slotBusinessTime.test.js src/utils/unpaidBookingLifecycle.test.js
      - name: Run TypeScript check
        run: pnpm run type-check
      - name: Build production bundle
        run: pnpm run build
